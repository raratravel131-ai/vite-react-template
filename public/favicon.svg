<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B0E14"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-gradient)" stroke="#262B3A" stroke-width="8"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9E1B"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- Beyond Trade Brand Orange Icon Box -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#orange-grad)"/>

  <!-- Trending Up Chart Arrow in dark slate (#0F172A) matching Navbar brand logo -->
  <path d="M160 336 L240 256 L288 304 L352 208" stroke="#0F172A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M296 208 H352 V264" stroke="#0F172A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
